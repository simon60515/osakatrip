/* 1. 當圖片載入失敗、為空或為透明圖時，強制隱藏圖片外框 */
.photo:empty,
.photo:has(img[src=""]),
.photo:has(img[src*="data:image"]),
.card-photo:has(img[src*="data:image"]) {
  display: none !important;
}

/* 2. 當按鈕沒有連結時，強制隱藏導航按鈕 */
a.btn-map[href=""],
a.btn-map[href="#"],
a[href=""] {
  display: none !important;
}

/* 3. 打勾清單直式條列排版 */
.chk-group {
  display: flex !important;
  flex-direction: column !important;
  gap: 10px !important;
  margin-top: 10px !important;
}

.chk-item {
  display: flex !important;
  align-items: flex-start !important;
  gap: 10px !important;
  font-size: 15px !important;
  line-height: 1.5 !important;
  cursor: pointer !important;
}

.chk-item input[type="checkbox"] {
  width: 18px !important;
  height: 18px !important;
  margin-top: 2px !important;
  flex-shrink: 0 !important;
}
  /* 1. 隱藏破圖框：當圖片是透明 SVG 或空值時，隱藏整個圖片外框 */

.photo:has(img[src=""]),
.card-photo:has(img[src*="data:image"]) {

}

/* 2. 隱藏空白導航按鈕：當連結沒有網址或為空時，隱藏按鈕 */

a[href="#"],
a:not([href*="http"]) {
  display: none !important;
}

/* 3. 讓打勾清單單行條列排好，不擠成一團 */

[data-day="0"] a.btn-map,
[data-day="0"] a:has(svg),
[data-day="0"] .map-link {

}

}

/* 2. 確保行前準備打勾清單垂直條列排版 */

}

}

  /* 當卡片沒有照片或來源為空時，完全隱藏圖片區塊 */
.photo:empty,
.photo:has(img[src=""]),
.photo:has(img:not([src])) {

  :root{
    --paper:#F7F3EC;
    --paper-deep:#EFE9DD;
    --ink:#2A2620;
    --ink-soft:#6B6459;
    --line:#DDD5C4;
    --card:#FFFFFF;

    --d1:#2F6F6F; --d1-soft:#E3EFEE;
    --d2:#6B4C7A; --d2-soft:#EEE6F1;
    --d3:#B7410E; --d3-soft:#F6E4DA;
    --d4:#2C3E70; --d4-soft:#E2E6F0;
    --d5:#A9790C; --d5-soft:#F3E9D2;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{max-width:880px;margin:0 auto;padding:0 20px 80px;}

  /* ---------- Header ---------- */
  header{
    padding:64px 20px 40px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  header .stamp-row{
    display:flex;justify-content:center;gap:10px;margin-bottom:22px;
  }
  header .stamp-row span{
    width:7px;height:7px;border-radius:50%;background:var(--ink-soft);opacity:.35;
  }
  h1{
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size:clamp(30px,5vw,46px);
    margin:0 0 10px;
    letter-spacing:.04em;
  }
  h1 .accent{color:var(--d3);}
  header p.sub{
    margin:0;
    color:var(--ink-soft);
    font-size:15px;
    letter-spacing:.08em;
  }
  header .rule{
    width:64px;height:2px;background:var(--ink);
    margin:26px auto 0;opacity:.7;
  }

  /* ---------- Day tabs ---------- */
  .tabs{
    position:sticky; top:0; z-index:20;
    background:var(--paper);
    display:flex; gap:6px;
    padding:14px 0 12px;
    overflow-x:auto;
    border-bottom:1px solid var(--line);
    margin-bottom:6px;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;
    font-family:'Noto Sans TC',sans-serif;
    font-size:14px;
    font-weight:700;
    padding:9px 18px;
    border-radius:20px;
    border:1.5px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    cursor:pointer;
    white-space:nowrap;
    transition:all .2s ease;
  }
  .tab[data-day="1"].active{background:var(--d1);border-color:var(--d1);color:#fff;}
  .tab[data-day="2"].active{background:var(--d2);border-color:var(--d2);color:#fff;}
  .tab[data-day="3"].active{background:var(--d3);border-color:var(--d3);color:#fff;}
  .tab[data-day="4"].active{background:var(--d4);border-color:var(--d4);color:#fff;}
  .tab[data-day="5"].active{background:var(--d5);border-color:var(--d5);color:#fff;}

  /* ---------- Day section ---------- */
  .day{display:none;padding-top:26px;}
  .day.active{display:block;}

  .day-head{margin-bottom:6px;}
  .day-head .kicker{
    font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--ink-soft);
  }
  .day-head h2{
    font-family:'Shippori Mincho',serif;
    font-size:24px;
    margin:4px 0 0;
    font-weight:700;
  }
  .day[data-day="1"] .day-head h2{color:var(--d1);}
  .day[data-day="2"] .day-head h2{color:var(--d2);}
  .day[data-day="3"] .day-head h2{color:var(--d3);}
  .day[data-day="4"] .day-head h2{color:var(--d4);}
  .day[data-day="5"] .day-head h2{color:var(--d5);}

  .note{
    margin:16px 0 30px;
    font-size:13.5px;
    color:var(--ink-soft);
    background:var(--paper-deep);
    border-radius:10px;
    padding:10px 14px;
    display:inline-flex;
    gap:8px;
    align-items:flex-start;
  }
  .note svg{flex:0 0 auto;margin-top:2px;}

  /* ---------- Timeline ---------- */
  .timeline{position:relative;padding-left:0;}
  .stop{
    display:grid;
    grid-template-columns:56px 1fr;
    gap:16px;
    position:relative;
    padding-bottom:30px;
  }
  .stop:last-child{padding-bottom:6px;}
  .stop::before{
    content:"";
    position:absolute;
    left:27px; top:56px; bottom:0;
    width:2px;
    background:var(--line);
  }
  .stop:last-child::before{display:none;}

  .icon-wrap{
    width:56px;height:56px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--card);
    border:2px solid var(--line);
    flex:0 0 56px;
    z-index:1;
  }
  .day[data-day="1"] .icon-wrap{border-color:var(--d1);color:var(--d1);background:var(--d1-soft);}
  .day[data-day="2"] .icon-wrap{border-color:var(--d2);color:var(--d2);background:var(--d2-soft);}
  .day[data-day="3"] .icon-wrap{border-color:var(--d3);color:var(--d3);background:var(--d3-soft);}
  .day[data-day="4"] .icon-wrap{border-color:var(--d4);color:var(--d4);background:var(--d4-soft);}
  .day[data-day="5"] .icon-wrap{border-color:var(--d5);color:var(--d5);background:var(--d5-soft);}
  .icon-wrap svg{width:26px;height:26px;}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 18px;
  }
  .card .time{
    font-size:12.5px;
    font-weight:700;
    letter-spacing:.05em;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .card h3{
    font-family:'Shippori Mincho',serif;
    font-size:18px;
    margin:0 0 10px;
    font-weight:700;
  }
  .photo{
    position:relative;
    width:100%;
    height:180px;
    border-radius:10px;
    overflow:hidden;
    background:var(--paper-deep);
    margin-bottom:12px;
  }
  .photo img{
    position:absolute; inset:0;
    width:100%;height:100%;
    object-fit:cover;
    display:none;
  }
  .photo .ph-fallback{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:6px;
    color:var(--ink-soft);
    background:
      repeating-linear-gradient(135deg, rgba(0,0,0,.02) 0 10px, transparent 10px 20px),
      var(--paper-deep);
  }
  .photo .ph-fallback svg{width:24px;height:24px;opacity:.55;}
  .photo .ph-fallback span{font-size:11.5px;letter-spacing:.03em;opacity:.8;}
  .photo img.loaded + .ph-fallback{display:none;}
  .card p{
    margin:0;
    font-size:14.5px;
    color:#403C34;
  }
  .tags{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;}
  .tag{
    font-size:12px;
    padding:3px 10px;
    border-radius:20px;
    background:var(--paper-deep);
    color:var(--ink-soft);
    font-weight:500;
  }
  .day[data-day="1"] .tag{background:var(--d1-soft);color:var(--d1);}
  .day[data-day="2"] .tag{background:var(--d2-soft);color:var(--d2);}
  .day[data-day="3"] .tag{background:var(--d3-soft);color:var(--d3);}
  .day[data-day="4"] .tag{background:var(--d4-soft);color:var(--d4);}
  .day[data-day="5"] .tag{background:var(--d5-soft);color:var(--d5);}

  .card-foot{
    margin-top:12px;
    display:flex;
    justify-content:flex-end;
  }
  .nav-btn{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:12.5px;
    font-weight:700;
    text-decoration:none;
    padding:6px 12px;
    border-radius:20px;
    border:1.3px solid var(--line);
    color:var(--ink);
    background:var(--paper);
    transition:filter .15s ease;
  }
  .nav-btn:hover{filter:brightness(0.96);}
  .nav-btn svg{width:13px;height:13px;}
  .day[data-day="1"] .nav-btn{border-color:var(--d1);color:var(--d1);}
  .day[data-day="2"] .nav-btn{border-color:var(--d2);color:var(--d2);}
  .day[data-day="3"] .nav-btn{border-color:var(--d3);color:var(--d3);}
  .day[data-day="4"] .nav-btn{border-color:var(--d4);color:var(--d4);}
  .day[data-day="5"] .nav-btn{border-color:var(--d5);color:var(--d5);}

  footer{
    text-align:center;
    padding:40px 20px 10px;
    color:var(--ink-soft);
    font-size:12.5px;
    letter-spacing:.06em;
  }

  @media (max-width:480px){
    .stop{grid-template-columns:44px 1fr;gap:12px;}
    .icon-wrap{width:44px;height:44px;flex:0 0 44px;}
    .icon-wrap svg{width:20px;height:20px;}
    .stop::before{left:21px;}
  }
  /* 強制修正行程卡片內的圖片比例 */
img {
  width: 100% !important;
  height: auto !important;
  aspect-ratio: 16 / 9 !important;
  object-fit: cover !important;
  border-radius: 12px;
  display: block;
}
  /* 精準修正相片容器與圖片高度 */
.photo {
  height: 220px !important;       /* 容器高度拉高，可視喜好改成 200px~260px */
  border-radius: 12px !important;
  overflow: hidden !important;
}

.photo img {
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important;   /* 滿版裁切不變形 */
  display: block !important;
}
</style>
</head>

const tabsEl = document.getElementById('tabs');
const daysEl = document.getElementById('days');

DATA.forEach((d, idx) => {
  const tab = document.createElement('button');
  tab.className = 'tab' + (idx===0 ? ' active' : '');
  tab.dataset.day = d.day;
  tab.textContent = `Day ${d.day}｜${d.date}`;
  tab.onclick = () => selectDay(d.day);
  tabsEl.appendChild(tab);

  const section = document.createElement('section');
  section.className = 'day' + (idx===0 ? ' active' : '');
  section.dataset.day = d.day;

  const noteHtml = d.note ? `
    <div class="note">
      <svg width="15" height="15" viewBox="0 0 24 24"><use href="#i-note" xlink:href="#i-note"></use></svg>
      <span>${d.note}</span>
    </div>` : '';

  const stopsHtml = d.stops.map(s => `
    <div class="stop">
      <div class="icon-wrap"><svg viewBox="0 0 24 24"><use href="#i-${s.icon}" xlink:href="#i-${s.icon}"></use></svg></div>
      <div class="card">
        <div class="time">${s.time}</div>
        <h3>${s.name}</h3>
        <div class="photo">
          <img src="photos/${s.img}" alt="${s.name}" onload="this.style.display='block'; this.classList.add('loaded')" onerror="this.style.display='none'">
          <div class="ph-fallback">
            <svg><use href="#i-camera" xlink:href="#i-camera"></use></svg>
            <span>photos/${s.img}</span>
          </div>
        </div>
        <p>${s.desc}</p>
        ${s.tags ? `<div class="tags">${s.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>` : ''}
        <div class="card-foot">
          <a class="nav-btn" href="${s.mapUrl}" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24"><use href="#i-pin" xlink:href="#i-pin"></use></svg>
            開啟導航
          </a>
        </div>
      </div>
    </div>
  `).join('');

  section.innerHTML = `
    <div class="day-head">
      <div class="kicker">DAY ${d.day} ／ ${d.date}</div>
      <h2>${d.title}</h2>
    </div>
    ${noteHtml}
    <div class="timeline">${stopsHtml}</div>
  `;
  daysEl.appendChild(section);
});

function selectDay(day){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', +t.dataset.day === day));
  document.querySelectorAll('.day').forEach(s => s.classList.toggle('active', +s.dataset.day === day));
  window.scrollTo({top:0, behavior:'smooth'});
}
</script>
